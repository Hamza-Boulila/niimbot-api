[project]
name = "niimbot-api"
version = "0.2.0"
description = "HTTP API and CLI for printing images on Niimbot label printers, built on niimprint"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "src/niimbot_api/niimprint/LICENSE"]
authors = [{ name = "Hamza Boulila", email = "hamza.boulila@outlook.com" }]
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "click>=8.1",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pillow>=10.1",
    "pydantic-settings>=2.15.0",
    "pyserial>=3.5",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
niimbot = "niimbot_api.cli:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
